<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منبه صرف الخبز والتموين</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #121812;
            color: #fff;
            padding: 15px;
            max-width: 480px;
            margin: auto;
        }
        .card {
            background: #1e261e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            border: 1px solid #2d3b2d;
        }
        h2, h3 { text-align: center; color: #a3e4d7; }
        .alert-box {
            background: #2c3e35;
            border-right: 4px solid #27ae60;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
        }
        .btn-custom {
            display: block;
            width: 100%;
            background: #27ae60;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-token {
            background: #2980b9;
        }
        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            background: #2d3b2d;
            color: #fff;
            border: 1px solid #4caf50;
            border-radius: 6px;
            margin-top: 5px;
        }
        textarea {
            width: 100%;
            padding: 8px;
            font-size: 11px;
            resize: none;
            box-sizing: border-box;
            direction: ltr;
            text-align: left;
            background: #2d3b2d;
            color: #fff;
            border: 1px solid #2980b9;
            border-radius: 6px;
            margin-top: 5px;
        }
        label {
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- بطاقة الأسرة -->
    <div class="card">
        <h2>بطاقة الأسرة والتموين 🍞</h2>
        <div style="background: linear-gradient(135deg, #d4ac0d, #b7950b); padding: 15px; border-radius: 10px; color: #000; margin-bottom: 10px;">
            <strong>جمهورية مصر العربية</strong>
            <h3 style="margin: 5px 0; color: #000;">تونس روماني</h3>
        </div>
        <button class="btn-custom">طلب البطاقة للتعامل</button>
    </div>

    <!-- موعد وقواعد الشهر (الأول والأخير الذكية) -->
    <div class="card">
        <div id="monthlyRuleStatus" class="alert-box">
            جاري فحص حالة الشهر...
        </div>
        <div style="text-align: center; font-size: 14px;">
            جاهز للصرف اليوم! <br>يمكنك الآن الحجز وصرف خبزك مساواة.
        </div>
    </div>

    <!-- الإعدادات والتنبيهات -->
    <div class="card">
        <h3>الإعدادات والتنبيهات ⚙️</h3>
        
        <div style="margin-bottom: 12px;">
            <label>اسم صاحب البطاقة:</label>
            <input type="text" value="تونس روماني" readonly>
        </div>

        <div style="margin-bottom: 12px;">
            <label>عدد الأفراد المستفيدين:</label>
            <input type="text" value="4" readonly>
        </div>

        <!-- اختيار نغمة المنبه المخصصة من الهاتف -->
        <div style="margin-bottom: 15px;">
            <label for="customAlarmInput" style="display: block; margin-bottom: 5px;">🎵 ملف صوتي للمنبه (اختيار من الجهاز):</label>
            <input type="file" id="customAlarmInput" accept="audio/*">
        </div>

        <!-- عنصر الصوت المخفي -->
        <audio id="alarmSound" preload="auto" loop></audio>

        <!-- زر وخانة جلب وعرض التوكن مؤقتاً -->
        <div style="margin-top: 15px; border-top: 1px dashed #4caf50; padding-top: 12px;">
            <label style="display: block; margin-bottom: 5px; color: #a3e4d7;">🔑 جلب رمز التنبيهات (FCM Token):</label>
            <button type="button" class="btn-custom btn-token" onclick="fetchAndShowToken()">جلب التوكن الآن</button>
            <textarea id="fcmTokenDisplay" readonly rows="3" placeholder="اضغط على زر جلب التوكن أعلاه ليظهر هنا..."></textarea>
        </div>
    </div>

    <!-- تحميل مكتبات فايربيس -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-messaging-compat.js"></script>

    <script>
      // 1. حساب قواعد أول وأخر الشهر ديناميكياً (15 رغيف أول الشهر ونهاية الشهر أوتوماتيك)
      function checkMonthlyBreadRule() {
        const now = new Date();
        const day = now.getDate();
        const month = now.getMonth();
        const year = now.getFullYear();
        
        const lastDayOfCurrentMonth = new Date(year, month + 1, 0).getDate();
        
        const statusBox = document.getElementById('monthlyRuleStatus');
        if (statusBox) {
          if (day === 1) {
            statusBox.innerHTML = "🚨 تنبيه أول الشهر: اليوم هو يوم 1، سيتم صرف 15 رغيف فقط اليوم!";
            statusBox.style.background = "#512e5f";
            statusBox.style.borderColor = "#8e44ad";
          } else if (day === lastDayOfCurrentMonth) {
            statusBox.innerHTML = `⚠️ تنبيه أخر الشهر: اليوم هو أخر يوم في الشهر (${day}/${month + 1})، تأكد من حالة حصة الخبز النهائية!`;
            statusBox.style.background = "#784212";
            statusBox.style.borderColor = "#d35400";
          } else {
            statusBox.innerHTML = `📅 اليوم هو يوم ${day} من الشهر (الشهر ينتهي في يوم ${lastDayOfCurrentMonth}). الوضع طبيعي.`;
            statusBox.style.background = "#1b4f72";
            statusBox.style.borderColor = "#2980b9";
          }
        }
      }

      checkMonthlyBreadRule();

      // 2. إدارة اختيار النغمة المخصصة من التليفون
      document.getElementById('customAlarmInput').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
          const fileURL = URL.createObjectURL(file);
          const audioElement = document.getElementById('alarmSound');
          audioElement.src = fileURL;
          alert("تم ضبط نغمة المنبه المخصصة بنجاح يا بطل! 🎵");
        }
      });

      // 3. تهيئة فايربيس ودالة جلب التوكن عند الطلب
      const firebaseConfig = {
        apiKey: "AIzaSyBzCbEv09jVBLyKs2W5PSUHJZ9b5f5wox0",
        authDomain: "bread-app-fa911.firebaseapp.com",
        projectId: "bread-app-fa911",
        storageBucket: "bread-app-fa911.firebasestorage.app",
        messagingSenderId: "881646311297",
        appId: "1:881646311297:web:8de38d7dd1d2533a23fa80",
        measurementId: "G-D3WF378JCB"
      };

      firebase.initializeApp(firebaseConfig);
      const messaging = firebase.messaging();

      function fetchAndShowToken() {
        const tokenInput = document.getElementById('fcmTokenDisplay');
        tokenInput.value = "جاري طلب الإذن وجلب التوكن...";

        Notification.requestPermission().then((permission) => {
          if (permission === 'granted') {
            navigator.serviceWorker.register('./firebase-messaging-sw.js')
              .then((registration) => {
                return messaging.getToken({ 
                  vapidKey: 'BPQCg0zIJqQNCUioc6DGtbxMPfdAEywMfYVNVRvo6qliz2ErQFCLvMSNsROKkqlTaR0EfHQKw3sXOaEKF-vqjZo',
                  serviceWorkerRegistration: registration 
                });
              })
              .then((currentToken) => {
                if (currentToken) {
                  tokenInput.value = currentToken;
                  console.log('🔥 FCM Token:', currentToken);
                } else {
                  tokenInput.value = "لم يتم توليد توكن.";
                }
              })
              .catch((err) => {
                console.error('خطأ أثناء جلب التوكن:', err);
                tokenInput.value = "خطأ: " + err.message;
              });
          } else {
            tokenInput.value = "تم رفض إذن الإشعارات من المتصفح.";
          }
        }).catch((err) => {
          tokenInput.value = "خطأ في طلب الإذن: " + err.message;
        });
      }
    </script>
</body>
</html>
